services:
  cesura:
    build: .
    image: cesura:local
    restart: unless-stopped
    # Must be able to write ./config (host key, setup state, cookies.txt).
    user: "${CESURA_UID:-1000}:${CESURA_GID:-1000}"
    environment:
      HOST_KEY: ${HOST_KEY:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      TRUSTED_PROXY_CIDR: ${TRUSTED_PROXY_CIDR:-172.16.0.0/12}
      YTM_CLIENT_ID: ${YTM_CLIENT_ID:-}
      YTM_CLIENT_SECRET: ${YTM_CLIENT_SECRET:-}
    ports:
      # Docker publishes ports around host firewalls such as UFW, so BIND is
      # the real exposure control. Keep 127.0.0.1 behind a reverse proxy/tunnel.
      - "${BIND:-127.0.0.1}:${PORT:-8765}:8765"
    volumes:
      - ./config:/app/config
    tmpfs:
      - /tmp
